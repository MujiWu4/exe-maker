name: 雲端全自動封包機器_V2版

on:
  workflow_dispatch: # 讓你在 GitHub 網頁上隨時可以手動點擊按鈕來打包

jobs:
  build-windows:
    runs-on: windows-latest # 叫出一台微軟最新版的雲端虛擬電腦

    env:
      # 配合 2026 官方最新規範，強迫使用高效能的 Node.js 24 環境，防止警告打架
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # 1. 把你的程式碼從 GitHub 倉庫下載到雲端機器裡
      - name: 1. 檢查並載入程式碼
        uses: actions/checkout@v4

      # 2. 幫雲端機器安裝 Python 環境
      - name: 2. 初始化 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 使用最穩定且支援 PyInstaller 的 Python 版本
          cache: "pip"

      # 3. 安裝樂器行對帳小幫手需要的四大護法套件
      - name: 3. 安裝相依套件與打包工具
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl pandas

      # 4. 🔥【核心魔法】將 V2 程式碼封包成 EXE
      # --onefile 表示打包成單一獨立檔案，--noconsole 表示執行時不會彈出黑黑的命令提示字元視窗
      - name: 4. 使用 PyInstaller 執行封包
        run: |
          pyinstaller --onefile --noconsole "進貨清單處理程式V2.py"

      # 5. 🚀【收網大成功】把打包好的完美 V2 .exe 成品上傳到網頁供你下載
      - name: 5. 傳送 EXE 成品至網頁展示架
        uses: actions/upload-artifact@v4
        with:
          name: 進貨清單處理程式V2_Windows執行檔 # 這會是你下載下來的壓縮包名字
          path: dist/進貨清單處理程式V2.exe # 這裡路徑精準對齊，絕對不會再走丟！
