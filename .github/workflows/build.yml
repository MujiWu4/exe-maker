name: 雲端自選檔案打包工具 (EXE)

on:
  workflow_dispatch: # 啟用 GitHub 網頁手動觸發功能
    inputs:
      file_name:
        description: '請輸入您要封包的 Python 原始碼檔名（需包含 .py 後綴）'
        required: true
        default: 'seo_universal_final_v2.py' # 預設顯示的主要檔案名稱
        type: string
      version_tag:
        description: '請設定本次發佈的版本號（例如: v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write # 賦予雲端電腦寫入 Release 的權限

env:
  # 2026 最新最高防護：提前強制所有雲端套件以穩定的 Node 24 引擎運行，消除警告並加速打包
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 升級至支援 Node 24 核心之最新 checkout 變體
      - name: 1. 複製 GitHub 原始碼到雲端
        uses: actions/checkout@v4.2.2

      - name: 2. 驗證檔案是否存在（防呆檢查）
        shell: bash
        run: |
          if [ ! -f "${{ github.event.inputs.file_name }}" ]; then
            echo "❌ 錯誤：在您的 GitHub 倉庫中找不到名為 [${{ github.event.inputs.file_name }}] 的檔案！"
            echo "請確認檔案名稱大小寫是否正確、或是否已成功 Push 上傳。"
            exit 1
          fi

      # 升級至支援 Node 24 核心之最新 python 環境變體
      - name: 3. 初始化雲端 Python 環境
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: 4. 安裝必要套件與封包工具
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: 5. 啟動 PyInstaller 封包您選取的檔案
        run: |
          # 動態讀取網頁輸入的檔名進行封包
          pyinstaller --onefile --noconsole "${{ github.event.inputs.file_name }}"

      # 升級至支援 Node 24 核心之最新 release 投放變體
      - name: 6. 自動創建 GitHub Release 並發佈軟體
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "發佈版本 ${{ github.event.inputs.version_tag }}"
          body: "此版本是由雲端自動化手動封包產出的 [${{ github.event.inputs.file_name }}] 執行檔。"
          files: dist/*.exe # 自動尋找 dist 資料夾底下打包好的 exe 檔案上傳
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
