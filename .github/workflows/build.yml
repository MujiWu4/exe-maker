name: 選擇檔案並自動打包 EXE 流程

# 設定為手動觸發，並提供視窗讓使用者輸入要打包的檔案
on:
  workflow_dispatch:
    inputs:
      target_file:
        description: '請輸入想要封包的 Python 檔名（需包含 .py 擴充檔名）'
        required: true
        default: 'main.py'  # 預設檔名

jobs:
  build_windows_exe:
    runs-on: windows-latest

    steps:
    # 步驟 1：複製程式碼到雲端伺服器
    - name: 複製程式碼
      uses: actions/checkout@v4

    # 步驟 2：設定 Python 環境
    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步驟 3：安裝打包工具 PyInstaller
    - name: 安裝 PyInstaller 打包工具
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # 步驟 4：動態取得檔名並執行 PyInstaller 打包
    # ${{ github.event.inputs.target_file }} 會自動帶入您在網頁上輸入的檔名
    - name: 使用 PyInstaller 打包指定檔案
      run: |
        pyinstaller --onefile --noconsole "${{ github.event.inputs.target_file }}"

    # 步驟 5：動態上傳封包好的成果
    # 使用 PowerShell 自動偵測 dist 資料夾底下的 .exe 檔案並上傳，確保檔名一致
    - name: 上傳成果物
      uses: actions/upload-artifact@v4
      with:
        name: Packaged_Windows_EXE
        path: dist/*.exe
