name: 雲端全自動封包機器_V2版

on:
  workflow_dispatch: # 讓你在 GitHub 網頁上隨時可以手動點擊按鈕來打包

jobs:
  build-windows:
    # 提前換上 GitHub 2026 年 6 月規定的最新版虛擬機，完美預防系統過期警告！
    runs-on: windows-2025-vs2026

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # 1. 把你的程式碼從 GitHub 倉庫下載到雲端機器裡
      - name: 1. 檢查並載入程式碼
        uses: actions/checkout@v4

      # 2. 幫雲端機器安裝 Python 環境
      - name: 2. 初始化 Python 環境
        uses: actions/setup-python@v5
        # 🚨【核心魔法修正】移除 cache: "pip" 設定！
        # 這樣機器就不會傻傻去檢查 requirements.txt 檔案，徹底解決卡住的問題！

      # 3. 手動安裝樂器行對帳小幫手需要的套件
      - name: 3. 安裝相依套件與打包工具
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl pandas

      # 4. 將 V2 程式碼封包成 EXE
      - name: 4. 使用 PyInstaller 執行封包
        run: |
          pyinstaller --onefile --noconsole "進貨清單處理程式V2.py"

      # 5. 把打包好的完美 V2 .exe 成品上傳到網頁供你下載
      - name: 5. 傳送 EXE 成品至網頁展示架
        uses: actions/upload-artifact@v4
        with:
          name: 進貨清單處理程式V2_Windows執行檔
          path: dist/進貨清單處理程式V2.exe
