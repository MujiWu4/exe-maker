name: 雲端自選檔案打包工具 (EXE)

on:
  workflow_dispatch: # 啟用 GitHub 網頁手動觸發功能
    inputs:
      file_name:
        description: '請輸入您要封包的 Python 原始碼檔名（需包含 .py 後綴）'
        required: true
        default: 'seo_universal_final_v2.py' # 預設顯示的主要檔案名稱
        type: string
      version_tag:
        description: '請設定本次發佈的版本號（例如: v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write # 賦予雲端電腦絕對的寫入與發佈權限

env:
  # 強制所有雲端套件以穩定的 Node 24 引擎運行，確保 2026 年環境完美執行
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 綁定官方權限金鑰

jobs:
  build-and-release:
    runs-on: windows-2025

    steps:
      - name: 1. 複製 GitHub 原始碼到雲端
        uses: actions/checkout@v4.2.2

      - name: 2. 驗證檔案是否存在（防呆檢查）
        shell: bash
        run: |
          if [ ! -f "${{ github.event.inputs.file_name }}" ]; then
            echo "❌ 錯誤：在您的 GitHub 倉庫中找不到名為 [${{ github.event.inputs.file_name }}] 的檔案！"
            echo "請確認檔案名稱大小寫是否正確、或是否已成功 Push 上傳。"
            exit 1
          fi

      - name: 3. 初始化雲端 Python 環境
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: 4. 安裝必要套件與封包工具
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: 5. 啟動 PyInstaller 進行「同名 EXE」智慧封包
        shell: bash
        run: |
          FULL_FILENAME="${{ github.event.inputs.file_name }}"
          # 自動切除 .py 後綴，只留下純檔名 (例如: seo_universal_final_v2)
          EXE_NAME=$(basename "$FULL_FILENAME" .py)
          
          echo "EXE_NAME_RAW=$EXE_NAME" >> $GITHUB_ENV
          echo "正在將 [ $FULL_FILENAME ] 打包成同名執行檔 [ ${EXE_NAME}.exe ]..."
          pyinstaller --onefile --noconsole --name "$EXE_NAME" "$FULL_FILENAME"

      # 【核心新增：完美還原您的截圖畫面】直接將同名 EXE 發佈到網頁下方的 Artifacts 直接下載區
      - name: 6. 將同名 EXE 檔案直接提交至 Artifacts 下載區
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ env.EXE_NAME_RAW }}_Windows版_EXE" # 檔名與你指定的型號 100% 智慧同步
          path: dist/*.exe # 自動抓取 dist 資料夾底下打包好的同名 exe 檔案
          retention-days: 90 # 檔案在 GitHub 雲端下載區保留 90 天

      - name: 7. 呼叫 GitHub 官方 CLI 進行智慧創建與強行覆蓋發佈
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          FILE="${{ github.event.inputs.file_name }}"
          
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "發佈版本 $TAG" --notes "此版本是由雲端自動化手動封包產出的 [ $FILE ] 執行檔。"
          fi
          
          echo "正在啟動官方強行覆蓋機制上傳同名 EXE 檔案至 Release..."
          gh release upload "$TAG" dist/*.exe --clobber
